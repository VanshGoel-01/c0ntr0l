openapi: 3.1.0
info:
  title: c0ntr0l API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Get Health
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/chat/completions:
    post:
      tags:
      - chat
      summary: Create Chat Completion
      operationId: createChatCompletion
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          title: X-Request-Id
      - name: X-Control-Demo-Scenario
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 32
          - type: 'null'
          title: X-Control-Demo-Scenario
      - name: X-Control-Application
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 63
          - type: 'null'
          title: X-Control-Application
      - name: X-Control-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 63
          - type: 'null'
          title: X-Control-Agent
      - name: X-Control-Provider
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(?:auto|[a-z0-9][a-z0-9_-]{0,62})$
          - type: 'null'
          title: X-Control-Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
        '403':
          description: The project model policy blocked the provider call
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/events:
    get:
      tags:
      - events
      summary: Stream Control Events
      operationId: streamControlEvents
      security:
      - bearerAuth: []
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^\d+-\d+$
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/executions:
    get:
      tags:
      - executions
      summary: List Executions
      operationId: listExecutions
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionSummary'
                title: Response Listexecutions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/executions/{execution_id}:
    get:
      tags:
      - executions
      summary: Get Execution
      operationId: getExecution
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents:
    get:
      tags:
      - incidents
      summary: List Incidents
      operationId: listIncidents
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/IncidentStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentContext'
                title: Response Listincidents
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents/{incident_id}:
    patch:
      tags:
      - incidents
      summary: Update Incident Status
      operationId: updateIncidentStatus
      security:
      - bearerAuth: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Incident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentContext'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model-policies:
    get:
      tags:
      - model-policies
      summary: List Model Policies
      operationId: listModelPolicies
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelPolicyContext'
                type: array
                title: Response Listmodelpolicies
      security:
      - bearerAuth: []
    put:
      tags:
      - model-policies
      summary: Upsert Model Policy
      operationId: upsertModelPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPolicyUpsert'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPolicyContext'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /api/v1/providers:
    get:
      tags:
      - providers
      summary: List Providers
      operationId: listProviders
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalog'
      security:
      - bearerAuth: []
  /api/v1/workspace:
    get:
      tags:
      - workspace
      summary: Get Workspace
      operationId: getWorkspace
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceContext'
      security:
      - bearerAuth: []
  /api/v1/runtime/executions:
    post:
      tags:
      - runtime
      summary: Start Runtime Execution
      operationId: startRuntimeExecution
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeExecutionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeExecutionCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /api/v1/runtime/executions/{execution_id}/preflight:
    post:
      tags:
      - runtime
      summary: Preflight Runtime Model Call
      operationId: preflightRuntimeModelCall
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimePreflightRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimePreflightResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/executions/{execution_id}/actions/check:
    post:
      tags:
      - runtime
      summary: Check Runtime Action
      operationId: checkRuntimeAction
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeActionCheckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeActionDecision'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/executions/{execution_id}/actions/{action_id}/complete:
    post:
      tags:
      - runtime
      summary: Complete Runtime Action
      operationId: completeRuntimeAction
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeActionCompleteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeActionCompleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/executions/{execution_id}/intervention:
    get:
      tags:
      - runtime
      summary: Get Runtime Intervention
      operationId: getRuntimeIntervention
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeIntervention'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/executions/{execution_id}/cancel:
    post:
      tags:
      - runtime
      summary: Cancel Runtime Execution
      operationId: cancelRuntimeExecution
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCancellationResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/executions/{execution_id}/recover:
    post:
      tags:
      - runtime
      summary: Recover Runtime Execution
      operationId: recoverRuntimeExecution
      security:
      - bearerAuth: []
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRecoveryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRecoveryResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApplicationContext:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        environment:
          type: string
          title: Environment
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - slug
      - name
      - environment
      - status
      title: ApplicationContext
    BudgetPolicyContext:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        scope_type:
          type: string
          title: Scope Type
        scope_id:
          type: string
          format: uuid
          title: Scope Id
        period_type:
          type: string
          title: Period Type
        mode:
          type: string
          title: Mode
        max_requests:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Requests
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
        max_cost:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Max Cost
        currency:
          type: string
          title: Currency
        is_enabled:
          type: boolean
          title: Is Enabled
      type: object
      required:
      - id
      - name
      - scope_type
      - scope_id
      - period_type
      - mode
      - max_requests
      - max_tokens
      - max_cost
      - currency
      - is_enabled
      title: BudgetPolicyContext
    ChatChoice:
      properties:
        index:
          type: integer
          title: Index
          default: 0
        message:
          $ref: '#/components/schemas/ResponseMessage'
        finish_reason:
          type: string
          title: Finish Reason
      type: object
      required:
      - message
      - finish_reason
      title: ChatChoice
    ChatCompletion:
      properties:
        id:
          type: string
          title: Id
        object:
          type: string
          title: Object
          default: chat.completion
        created:
          type: integer
          title: Created
        model:
          type: string
          title: Model
        choices:
          items:
            $ref: '#/components/schemas/ChatChoice'
          type: array
          minItems: 1
          title: Choices
        usage:
          $ref: '#/components/schemas/Usage'
      type: object
      required:
      - id
      - created
      - model
      - choices
      - usage
      title: ChatCompletion
    ChatMessage:
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
          maxLength: 32768
          minLength: 1
          title: Content
        name:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Name
      type: object
      required:
      - role
      - content
      title: ChatMessage
    ChatRequest:
      properties:
        model:
          type: string
          maxLength: 128
          minLength: 1
          title: Model
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          maxItems: 100
          minItems: 1
          title: Messages
        stream:
          type: boolean
          title: Stream
          default: false
        stream_options:
          anyOf:
          - $ref: '#/components/schemas/StreamOptions'
          - type: 'null'
        max_tokens:
          type: integer
          maximum: 4096.0
          minimum: 1.0
          title: Max Tokens
          default: 256
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
      type: object
      required:
      - model
      - messages
      title: ChatRequest
    ContinuityPacket:
      properties:
        version:
          type: string
          title: Version
          default: '1.0'
        task:
          type: string
          title: Task
        source_execution_id:
          type: string
          format: uuid
          title: Source Execution Id
        source_provider:
          type: string
          title: Source Provider
          default: custom
        source_model:
          type: string
          title: Source Model
        completed_work:
          items:
            type: string
          type: array
          title: Completed Work
        failed_operation:
          additionalProperties: true
          type: object
          title: Failed Operation
        reason_for_intervention:
          type: string
          title: Reason For Intervention
        recommended_action:
          type: string
          title: Recommended Action
        evidence:
          additionalProperties: true
          type: object
          title: Evidence
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - task
      - source_execution_id
      - source_model
      - reason_for_intervention
      - recommended_action
      - created_at
      title: ContinuityPacket
    DependencyHealth:
      properties:
        status:
          $ref: '#/components/schemas/DependencyStatus'
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - status
      title: DependencyHealth
    DependencyStatus:
      type: string
      enum:
      - healthy
      - unhealthy
      title: DependencyStatus
    ExecutionDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
        project_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Name
        application_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Id
        application_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Name
        agent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Agent Id
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        status:
          type: string
          title: Status
        requested_model:
          type: string
          title: Requested Model
        active_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Provider
        active_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Model
        is_streaming:
          type: boolean
          title: Is Streaming
        input_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Fingerprint
        output_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Fingerprint
        final_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Final Reason
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        started_at:
          type: string
          format: date-time
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        span_count:
          type: integer
          minimum: 0.0
          title: Span Count
        total_tokens:
          type: integer
          minimum: 0.0
          title: Total Tokens
        total_cost:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Cost
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        spans:
          items:
            $ref: '#/components/schemas/SpanSummary'
          type: array
          title: Spans
        usage:
          items:
            $ref: '#/components/schemas/UsageSummary'
          type: array
          title: Usage
      type: object
      required:
      - id
      - status
      - requested_model
      - active_provider
      - active_model
      - is_streaming
      - input_fingerprint
      - output_fingerprint
      - final_reason
      - error_code
      - started_at
      - completed_at
      - duration_ms
      - span_count
      - total_tokens
      - total_cost
      - spans
      - usage
      title: ExecutionDetail
    ExecutionSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
        project_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Name
        application_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Id
        application_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Name
        agent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Agent Id
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        status:
          type: string
          title: Status
        requested_model:
          type: string
          title: Requested Model
        active_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Provider
        active_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Model
        is_streaming:
          type: boolean
          title: Is Streaming
        input_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Fingerprint
        output_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Fingerprint
        final_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Final Reason
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        started_at:
          type: string
          format: date-time
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        span_count:
          type: integer
          minimum: 0.0
          title: Span Count
        total_tokens:
          type: integer
          minimum: 0.0
          title: Total Tokens
        total_cost:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Cost
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - id
      - status
      - requested_model
      - active_provider
      - active_model
      - is_streaming
      - input_fingerprint
      - output_fingerprint
      - final_reason
      - error_code
      - started_at
      - completed_at
      - duration_ms
      - span_count
      - total_tokens
      - total_cost
      title: ExecutionSummary
    FunctionCall:
      properties:
        name:
          type: string
          title: Name
        arguments:
          type: string
          title: Arguments
      type: object
      required:
      - name
      - arguments
      title: FunctionCall
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
