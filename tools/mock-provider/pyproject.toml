[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c0ntr0l-mock-provider"
version = "0.1.0"
description = "Deterministic OpenAI-compatible provider for c0ntr0l demos and tests"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mock_provider*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
