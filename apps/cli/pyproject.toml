[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c0ntr0l-cli"
version = "0.1.0"
description = "Operational CLI for the c0ntr0l AI runtime control plane"
requires-python = ">=3.11"
dependencies = [
    "c0ntr0l-schemas==0.1.0",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "rich>=13,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
]

[project.scripts]
c0ntr0l = "control_cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["control_cli*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
