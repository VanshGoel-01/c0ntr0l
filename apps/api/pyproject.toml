[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c0ntr0l-api"
version = "0.1.0"
description = "Runtime safety and observability gateway for AI applications"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "c0ntr0l-schemas==0.1.0",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "redis>=5,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
